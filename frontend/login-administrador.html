<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/registrar.stands.css">
    <title>Acceso Administrador</title>
</head>
<body>
    <!-- Barra de navegación compartida (js/header.js) -->
    <div id="header"></div>

    <!-- Contenido Principal: Formulario de Login -->
    <main class="container my-5">
        <h2 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="fa-solid fa-user-shield"></i> Acceso Administrador
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Tarjeta con el estilo de sombra y bordes -->
                <div class="card p-4 borde-formulario bg-white">
                    <form id="form-login-administrador" onsubmit="validarAdministrador(event)">

                        <!-- Correo -->
                        <div class="mb-4">
                            <label for="correo" class="form-label fw-bold">Correo institucional <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-at"></i></span>
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@cenfotec.ac.cr" required>
                            </div>
                            <div class="form-text">Solo los correos @cenfotec.ac.cr tienen acceso como administrador.</div>
                        </div>

                        <!-- Botón Ingresar -->
                        <div class="text-end">
                            <button type="submit" class="btn btn-registrar-stand">Ingresar</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/login-administrador.js"></script>
</body>
</html>
