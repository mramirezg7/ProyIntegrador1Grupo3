<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/administrador.css">
    <title>Página de Administración</title>
</head>
<body>
    <!-- Barra de navegación compartida (js/header.js) -->
    <div id="header"></div>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <h1 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="fa-solid fa-gears"></i> Página de administración
        </h1>

        <!-- Selector de la entidad que se desea administrar -->
        <div class="card p-4 mb-5 borde-formulario bg-white">
            <label for="selectorEntidad" class="form-label fw-bold">Seleccione la entidad que desea administrar</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-database"></i></span>
                <select class="form-select" id="selectorEntidad">
                    <option value="">Seleccione una entidad...</option>
                    <option value="actividades">Actividades</option>
                    <option value="estudiantes">Estudiantes</option>
                    <option value="stands">Stands</option>
                </select>
            </div>
            <div class="form-text">Al elegir una entidad se mostrarán todos los registros guardados en la base de datos.</div>
        </div>

        <div class="row g-4" id="contenedor-datos">
            <div class="col-12">
                <p class="text-muted fs-5 text-center">Seleccione una entidad para ver los registros.</p>
            </div>
        </div>
    </main>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/administrador.js"></script>
</body>
</html>
