<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/lista-actividades.css">
    <title>Detalle de Actividad</title>
</head>
<body>

    <!-- Barra de navegación compartida (js/header.js) -->
    <div id="header"></div>

    <!-- CONTENIDO DE LA ACTIVIDAD -->
    <div class="container my-5">
        <h2 class="fw-bold mb-4">Detalle de la Actividad</h2>
        
        <div class="row">
            <!-- Columna Izquierda: Imagen + Nombre -->
            <div class="col-md-5 mb-4">
                <img id="det-imagen" src="../img/campusFest.jpg" class="img-fluid rounded shadow mb-3" alt="Actividad">
                <h3 class="fw-bold" id="det-nombre">Cargando...</h3>
            </div>

            <!-- Columna Derecha: Descripción, Info Clave y Requisitos -->
            <div class="col-md-7">
                <h3 class="fw-bold">Descripción Completa</h3>
                <p id="det-descripcion" class="text-secondary">Cargando descripción...</p>
                
                <hr class="my-4">

                <h3 class="fw-bold">Información Clave</h3>
                <p class="mb-1"><strong>Categoría:</strong> <span id="det-categoria"></span></p>
                <p class="mb-1"><strong>Fecha:</strong> <span id="det-fecha"></span></p>
                <p class="mb-1"><strong>Hora:</strong> <span id="det-hora"></span></p>
                <p class="mb-1"><strong>Lugar:</strong> <span id="det-lugar"></span></p>
                <p class="mb-1"><strong>Cupo Máximo:</strong> <span id="det-cupo"></span></p>
                <p class="mb-1"><strong>Estado:</strong> <span id="det-estado"></span></p>

                <hr class="my-4">

                <h3 class="fw-bold">Requisitos de Participación</h3>
                <div id="det-requisitos" class="text-secondary"></div>

                <div class="mt-4">
                    <button id="btnInscribirme" class="btn btn-warning btn-lg mt-3 fw-bold px-4">Inscribirme</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/header.js"></script>
    <script src="js/imagen-actividad.js"></script>
    <script src="js/detalle-actividad.js"></script>
</body>
</html>
