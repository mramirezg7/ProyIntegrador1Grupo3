<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/lista-actividades.css">
    <title>Detalle de Actividad</title>
</head>
<body>
    <div class="container my-5">
        <h1 class="fw-bold mb-4" id="det-nombre">Cargando actividad...</h1>
        <div class="row">
            <div class="col-md-5 mb-4">
                <img id="det-imagen" src="../img/campusFest.jpg" class="img-fluid rounded shadow" alt="Actividad">
            </div>
            <div class="col-md-7">
                <h3>Información Clave</h3>
                <p><strong>Categoría:</strong> <span id="det-categoria"></span></p>
                <p><strong>Fecha:</strong> <span id="det-fecha"></span></p>
                <p><strong>Hora:</strong> <span id="det-hora"></span></p>
                <p><strong>Lugar:</strong> <span id="det-lugar"></span></p>
                <p><strong>Cupo Disponible:</strong> <span id="det-cupo"></span></p>
                <p><strong>Estado:</strong> <span id="det-estado"></span></p>

                <h3 class="mt-4">Requisitos de Participación</h3>
                <ul id="det-requisitos"></ul>

                <button class="btn btn-warning btn-lg mt-3 fw-bold px-4">Inscribirme</button>
            </div>
        </div>
    </div>

    <script src="js/detalle-actividad.js"></script>
</body>
</html>
